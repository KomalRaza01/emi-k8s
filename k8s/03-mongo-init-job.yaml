apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-init
  namespace: emi
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: mongo:7.0
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              for h in mongo-0 mongo-1 mongo-2; do
                until mongosh --host $h.mongo --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1; do
                  echo "waiting for $h.mongo ..."; sleep 3
                done
                echo "$h.mongo is up"
              done
              mongosh --host mongo-0.mongo --quiet --eval '
                try { rs.status(); print("replica set already initiated"); }
                catch (e) {
                  printjson(rs.initiate({
                    _id: "rs0",
                    members: [
                      { _id: 0, host: "mongo-0.mongo:27017" },
                      { _id: 1, host: "mongo-1.mongo:27017" },
                      { _id: 2, host: "mongo-2.mongo:27017" }
                    ]
                  }));
                }'
              echo "waiting for 1 PRIMARY + 2 SECONDARY ..."
              until mongosh --host mongo-0.mongo --quiet --eval '
                const m = rs.status().members;
                quit((m.filter(x => x.stateStr == "PRIMARY").length == 1 &&
                      m.filter(x => x.stateStr == "SECONDARY").length == 2) ? 0 : 1)' >/dev/null 2>&1; do
                sleep 3
              done
              mongosh --host mongo-0.mongo --quiet --eval 'rs.status().members.forEach(m => print(m.name + "  " + m.stateStr))'
