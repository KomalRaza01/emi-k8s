<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loan EMI Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 960px;">
  <h1 class="mb-4">Loan EMI Calculator</h1>
  <div class="row g-4">
    <div class="col-md-5">
      <div class="card shadow-sm"><div class="card-body">
        <form id="emiForm" novalidate>
          <div class="mb-3">
            <label class="form-label" for="P">Loan amount (P)</label>
            <input type="number" class="form-control" id="P" min="1" step="any" value="500000">
            <div class="invalid-feedback">Enter a positive number.</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="rate">Annual interest rate (%)</label>
            <input type="number" class="form-control" id="rate" min="0.01" step="any" value="12">
            <div class="invalid-feedback">Enter a positive number.</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="n">Tenure (months)</label>
            <input type="number" class="form-control" id="n" min="1" step="1" value="24">
            <div class="invalid-feedback">Enter a positive whole number.</div>
          </div>
          <button type="submit" class="btn btn-primary w-100">Calculate EMI</button>
        </form>
      </div></div>
    </div>
    <div class="col-md-7">
      <div class="card shadow-sm mb-4" id="resultPanel"><div class="card-body">
        <h5 class="card-title">Result</h5>
        <div id="resultBody" class="text-muted">Submit the form to see the result.</div>
      </div></div>
      <div class="card shadow-sm"><div class="card-body">
        <h5 class="card-title">Last 10 calculations</h5>
        <div class="table-responsive">
          <table class="table table-sm table-striped mb-0">
            <thead><tr><th>Time</th><th>P</th><th>Rate %</th><th>Months</th><th>EMI</th><th>Pod</th></tr></thead>
            <tbody id="historyBody"></tbody>
          </table>
        </div>
      </div></div>
    </div>
  </div>
  <footer class="text-center text-muted mt-4 small">DS-584 Cloud Computing &middot; EMI Calculator v1.1</footer>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="app.js"></script>
</body>
</html>
